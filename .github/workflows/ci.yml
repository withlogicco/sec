name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ${{ matrix.runs-on }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.6"
            runs-on: ubuntu-20.04
          - python-version: "3.7"
            runs-on: ubuntu-22.04
          - python-version: "3.8"
            runs-on: ubuntu-24.04
          - python-version: "3.9"
            runs-on: ubuntu-24.04
          - python-version: "3.10"
            runs-on: ubuntu-24.04
          - python-version: "3.11"
            runs-on: ubuntu-24.04
          - python-version: "3.12"
            runs-on: ubuntu-24.04
          - python-version: "3.13"
            runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest
